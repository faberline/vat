# Build the `vat` release binary.
#
# Triggers:
#   - push of a tag matching `vat@*`   → build + attach to GitHub release
#                                        (e.g. vat@1.0, vat@1.2.3)
#   - workflow_dispatch                → build artifacts only (manual smoke)
#
# Targets:
#   - aarch64-apple-darwin (Apple Silicon, macos-14 native)
#
# vat supports Apple Silicon macOS only (STATUS.md `VAT-S-HOST-LINUX`), so
# there are no Linux targets; install.sh refuses Linux with exit code 2.
name: vat-release

on:
  push:
    tags:
      - "vat@*"
  workflow_dispatch:

permissions:
  contents: write  # needed to create / upload release assets

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vat-${{ matrix.target }}

      - name: Build vat binary
        run: cargo build --release --locked -p vat --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="vat-${{ matrix.target }}"
          # Build inside a `pkg/` staging dir, then tar with -C so the
          # archive layout is `vat-<target>/{vat,README.md}` — matches
          # what install.sh expects on extract.
          stage="pkg/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/vat" "${stage}/vat"
          cp README.md "${stage}/README.md"
          # Emit the tarball + sha256 into `out/` (workspace root) so
          # upload-artifact's preserved `out/` prefix is shallow and
          # the release glob below is predictable.
          mkdir -p out
          tarball="out/${name}.tar.gz"
          tar -C pkg -czf "${tarball}" "${name}"
          shasum -a 256 "${tarball}" | awk '{print $1}' > "${tarball}.sha256"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "sha=${tarball}.sha256" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: vat-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          overwrite: true

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/vat@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact@v4 preserves the source path (`out/...`) inside
      # the artifact, so after merge-multiple the layout is
      # `dist/out/vat-*.tar.gz`. Glob with `**` so the release picks
      # them up regardless of nesting depth.
      - name: List artifacts (debug)
        run: find dist -type f -maxdepth 4 -print

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/vat-*.tar.gz
            dist/**/vat-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            `vat` release built from tag ${{ github.ref_name }}.

            Supported host: Apple Silicon macOS (`aarch64-apple-darwin`) only.
            There are no Linux or Intel macOS builds.

            ## Migration notes

            <!-- MIGRATION NOTES: the release is published from the workflow
                 file at the tagged commit, so edit this block in the commit
                 you tag. Replace this comment with the breaking changes and
                 upgrade steps for the release (see STATUS.md and the
                 milestone's issues), or write "None." -->
            See STATUS.md at this tag for the supported surface.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | sh
            ```

            Or download `vat-aarch64-apple-darwin.tar.gz` below and extract it manually.
