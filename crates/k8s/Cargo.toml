[package]
name = "vat-k8s"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "vat layer 3: a persistent K3s cluster on the shared machine with local GCP/GKE — metadata server and Workload Identity, Artifact Registry, and the Google Cloud emulators."
publish = false

[lib]
# The vendored googleapis protos carry doc-comment prose that prost emits as
# `///` docs; cargo would run them as doctests and fail (they aren't Rust).
doctest = false

[features]
default = ["gcp"]
# Built-in Rust emulators (Pub/Sub gRPC, Firebase Auth REST, Cloud Storage,
# Cloud Tasks, Cloud Scheduler, Workflows, HTTP mock, OpenAPI).
emulator = ["dep:tokio", "dep:axum", "dep:jsonwebtoken", "dep:tonic", "dep:prost", "dep:prost-types", "dep:async-trait", "dep:tokio-stream", "dep:async-stream", "dep:reqwest", "dep:cron", "dep:base64", "dep:percent-encoding", "dep:md-5", "dep:rcgen", "dep:rustls", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# The reusable minimal OCI registry server (local Artifact Registry).
registry = ["dep:tokio", "dep:axum", "dep:reqwest", "dep:base64", "dep:http-body-util"]
# Builtin services served from the machine's VMM process.
machine = ["vat-docker/machine"]
# Local GCP inside the machine: metadata server + Workload Identity, local
# Artifact Registry, and the shared Pub/Sub / Storage emulators.
gcp = ["machine", "emulator", "registry"]

[dependencies]
vat-docker = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }

tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { version = "0.13", optional = true }
async-trait = { version = "0.1", optional = true }
tokio-stream = { workspace = true, optional = true }
async-stream = { version = "0.3", optional = true }
reqwest = { workspace = true, optional = true }
cron = { version = "0.12", optional = true }
base64 = { workspace = true, optional = true }
percent-encoding = { version = "2", optional = true }
md-5 = { version = "0.10", optional = true }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["server", "client", "http1", "http2"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
http-body-util = { workspace = true, optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
