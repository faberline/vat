description = "Deterministic fake-container regression: published MicroVM ports must complete TCP/HTTP readiness or fail closed with persisted evidence and owned cleanup; a MicroVM preset never invokes Docker and verifies cached or pulled Apple images before run; this EC gate requires loopback sockets"

