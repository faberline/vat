capability_id = "agent-native-gpu-native-dev-containers"
claim_id = "microvm-sandbox-backend-for-vat-run"
description = "MicroVm backend unit contract for deterministic Apple Container argv, bounded system-status handling, and fail-closed runtime mechanics. Recorded validation: sandbox::microvm::tests passed 7/7; this unit result does not claim a real shared-builder state unless the installed Apple Container CLI supports it."

