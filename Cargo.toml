[workspace]
resolver = "2"
# vat is a layered container system shipped as one binary:
#   core    shared model (spec, config, state, store, overlay, host sandbox, GPU)
#   native  layer 1: Apple-native containers, run directly on the machine
#   docker  layer 2: the shared Linux machine and its Docker Engine
#   k8s     layer 3: K3s on that machine, with local GCP/GKE
#   cli     the `vat` binary that ties the layers together
members = ["crates/core", "crates/native", "crates/docker", "crates/k8s", "crates/cli"]

[workspace.package]
version = "0.4.5"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/vat"

[workspace.dependencies]
vat-core = { path = "crates/core" }
vat-native = { path = "crates/native", default-features = false }
vat-docker = { path = "crates/docker", default-features = false }
vat-k8s = { path = "crates/k8s", default-features = false }

tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
anyhow = "1.0"
url = "2.5"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
jsonwebtoken = "9"
clap = { version = "4", features = ["derive", "string"] }
dirs = "5"
toml = "0.8"
libc = "0.2"
signal-hook = "0.3"
getrandom = "0.3"
blake3 = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
tokio-rustls = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
