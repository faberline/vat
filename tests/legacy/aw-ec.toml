[[test_commands]]
id = "vat-headless-ephemeral-k8s"
command = "cargo test -p vat --test vat_k8s_ephemeral -- --nocapture"
capability_id = "agent-native-gpu-native-dev-containers"
claim_id = "headless-ephemeral-kubernetes-session"
description = "Deterministic Apple Container K3s regression: one-shot and leased lifecycles, exact-machine ownership, private kubeconfig/cache injection, cross-command exec, verified local-image cleanup, and Service-only loopback forwarding with K3s credentials and VAT_HOME stripped from the same-UID host child, not an OS sandbox. K3s commands require independent PATH kubectl and reject OrbStack-provided binaries. Omitted session-exec timeout uses remaining TTL; explicit timeout is 1..=14400 seconds and cannot exceed it. Every text/JSON exec owns and reaps its process group, holds the private lock through cleanup, and removes its marker only after group absence. A starting/live crash marker blocks later exec/delete/cleanup fail-closed rather than claiming termination. JSON emits one vat.k8s.session.exec.v1 with separate 64 KiB bounded streams, forwarded child exit, no raw replay, no session-record mutation, and masked private paths; the child is not an untrusted-child boundary. Independent-kubectl one-shot, leased, local-image, and Service-forward E2Es passed 1/1 (36 filtered) in 28.38s, 29.97s, 49.73s, and 49.57s. The local-image run loads one already-local Apple `alpine:3.20` into one active lease, runs a pod with `imagePullPolicy=Never`, observes its marker log, and completes exact session cleanup; it does not establish registry-pull generality, persistence, GUI, or Docker Engine/API behavior. The leased run proves text commands, strict JSON exec with `--timeout 30`, bounded `status --verify-api`, and exact delete. The Service-forward run proves one Service-only loopback text and strict JSON tunnel with a credential-free child, confirmed cleanup, and closed local ports. It does not prove a general cluster/tunnel, detached descendants, or crash-safe termination. No-flag status is unchanged; `status --verify-api` still requires no retained port-forward or exec marker, and the leased E2E is bounded active-lease evidence rather than a general API-status guarantee. Fake bootstrap/status/recovery coverage retains its bounded diagnostics, fail-closed identity checks, v1 storage-only handling, and cleanup tombstones."

