capability_id = "agent-native-gpu-native-dev-containers"
claim_id = "headless-ephemeral-kubernetes-session"
description = "Deterministic fake JSON-tunnel contract for `vat k8s session port-forward run --format json ID service/NAME PORT -- COMMAND`: text remains unchanged; JSON emits one `vat.k8s.session.port-forward.v1` only after shared-PGID tunnel cleanup is confirmed, with preserved child exit, separate 64 KiB serialized-capped streams, no raw replay, and `status --verify-api` next. The Service-only loopback host child is credential-free for K3s variables; VAT masks setup/API/tunnel/cleanup failures but preserves opaque child output in a successful result. Lease checks after API proof and immediately before kubectl/host spawn prevent a crossed TTL from opening a tunnel; partial reader setup reaps the direct child then completes outer-group cleanup before reader join. Focused deterministic filter passed 7/7. Independent-kubectl real-host E2E passed 1/1 (36 filtered) in 49.57s for one Service-only loopback text and strict JSON tunnel with confirmed cleanup and closed local ports; it is not a general tunnel claim."

